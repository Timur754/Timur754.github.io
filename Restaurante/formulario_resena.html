<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="author" content="Timur" />

<meta name="keywords" content="reseña, plato, paella, croquetas, tortilla de patatas" />
<title>Reseña de un plato</title>
</head>
<body>
<header>
<h1>Reseña de un plato</h1>
</header>
<nav>

<main>
    <form>
        <p>Plato:
        <select name="plato">
        <option>Paella</option>
        <option>Croquetas</option>
        <option>Tortilla de patatas</option>
        </select></p>
        <p>Su nombre: <input type="text" name="nombre" /></p>
        <p>Su reseña:<br />
        <textarea name="resena" rows="5" cols="50"></textarea></p>
        <p>
        <button type="submit">Enviar reseña</button>
        <button type="reset">Limpiar</button>
        </p>
    </form>
</main>
